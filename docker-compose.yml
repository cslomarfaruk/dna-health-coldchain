version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: coldchain_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coldchain_ehr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coldchain_ehr"]
      interval: 5s
      timeout: 5s
      retries: 5

  hapi-fhir:
    image: hapiproject/hapi:v6.8.0
    container_name: coldchain_hapi_fhir
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.reuse_cached_search_results_millis: 60000
    depends_on:
      - postgres

volumes:
  postgres_data:
